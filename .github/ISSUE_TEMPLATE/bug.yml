name: Feed, page, API or MCP bug
description: Something on cve.now is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem in cve.now itself? Email security@sazabi.ai instead of opening an issue.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Feed (RSS, Atom, JSON Feed)
        - Stack check or stack feed
        - Website page
        - JSON API
        - MCP server
        - Other
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL, request, or MCP tool call
      placeholder: https://cve.now/feed?tech=nextjs&format=json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      description: Feed reader, browser, or agent and version.
